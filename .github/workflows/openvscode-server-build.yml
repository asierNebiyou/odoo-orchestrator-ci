name: Build openvscode-server (macOS + Windows)

# Gitpod's own openvscode-server CI only ever publishes prebuilt release
# binaries for Linux (x64/arm64/armhf) -- confirmed against the real
# releases page, which ships exactly those three tarballs, and against
# gitpod-io/openvscode-releases' own release.yml, whose build matrix
# literally has darwin/win32 entries present but commented out. This
# workflow is the first real attempt at those two platforms: build the
# same "vscode-reh-web" (Remote Extension Host, web) server target Gitpod
# builds for Linux, on real macOS/Windows runners instead, using the exact
# same gulp task sequence their real release.yml uses.
#
# This is a feasibility spike, not a finished release pipeline -- the goal
# is a real binary on each platform so Odoo Orchestrator's editor sidecar
# (task 4.1) has something real to spawn, not a guess at what "should"
# work. The first run against real runners surfaced two real, unrelated
# native-module build failures (both fixed below, each with its own
# evidence):
#
# 1. macOS runner architecture: `macos-latest` now resolves to an Apple
#    Silicon (arm64) image, but the matrix asked for `arch: x64` (matching
#    the actual dev machine this binary needs to run on, which is Intel).
#    Fixed by pinning `macos-15-intel` -- GitHub's dedicated x86_64 image,
#    supported through August 2027 per their own runner-images tracker
#    (actions/runner-images#13045) -- instead of `macos-latest`.
#
# 2. macOS native-module build: `@vscode/spdlog`, pinned to exactly 0.15.7
#    by this checkout's own remote/package-lock.json, bundles fmt's
#    compile-time format-string checking (consteval), which a newer
#    Xcode/Clang on GitHub's macOS image rejects as "not a constant
#    expression". node-spdlog fixed this upstream by adding a
#    `FMT_CONSTEVAL=` define to binding.gyp (present on their `main`
#    branch/0.15.9, confirmed absent in the 0.15.7 tag this lockfile
#    pins) -- https://github.com/microsoft/node-spdlog. Rather than fork
#    openvscode-server's lockfile to bump one transitive dependency,
#    inject the same define via CXXFLAGS for the macOS job only.
#
# 3. Windows native-module build: `node-gyp` failed to detect Visual
#    Studio at all ("could not find a version of Visual Studio 2017 or
#    newer") despite VS being genuinely installed, because `windows-latest`
#    moved to Windows Server 2025 with Visual Studio 2026 (v18) in June
#    2026 (actions/runner-images#14017), and node-gyp's version detection
#    doesn't yet recognize v18 as a Visual Studio version at all --
#    confirmed open upstream (nodejs/node-gyp#3282). GitHub's own fix for
#    anyone needing the older toolchain is the dedicated `windows-2022`
#    image label (still VS 2022 / v17, which node-gyp does recognize),
#    named explicitly in their migration notice as the escape hatch.
#
# 4. Windows core build OOM: with the fixes above clearing npm ci, the
#    Windows job got to `npm run gulp core-ci`'s mangling pass and died
#    ~3 hours in with "Committing semi space failed... heap out of
#    memory" -- a genuine OS-level memory exhaustion, not a V8 heap-limit
#    hit (--max-old-space-size=8192 was already set). This is a known,
#    unresolved upstream cost of vscode's mangler (microsoft/vscode#243708
#    hit the identical crash on a 32-core/32GB local machine and was
#    closed "not planned"). gulpfile.vscode.ts defines `core-ci-pr` as
#    the unmangled sibling of `core-ci`, meant for PR validation builds --
#    since mangling only obfuscates/shrinks names for official releases
#    and buys nothing for a local dev sidecar binary, this workflow now
#    runs `core-ci-pr` instead.
#
# 5. A green build here proves gulp exited 0 -- it doesn't prove the
#    resulting binary actually serves anything. Added a smoke-test step
#    (right after the build, before packaging) that launches the real
#    ./bin/openvscode-server[.cmd] on the runner itself with the exact
#    flags EditorConfig/EditorSupervisor already build
#    (--host/--port/--connection-token/--user-data-dir/--extensions-dir/
#    --default-folder/--accept-server-license-terms, confirmed against
#    product.json's serverApplicationName and
#    serverEnvironmentService.ts's real argv definitions) and curls the
#    token-bearing URL until it gets back a real HTML page. This is what
#    actually closes 4.1's platform-binary gap, not the build step alone.
#
# First run against these fixes is still a feasibility check, not a
# guarantee -- other native modules (node-pty, native-watchdog,
# windows-process-tree, windows-registry, kerberos, @parcel/watcher)
# never got reached while spdlog/VS-detection were failing first, so this
# workflow may need another round once they do.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "openvscode-server tag/commit to build (default: a known-good tagged release)"
        required: false
        default: "openvscode-server-v1.109.5"

env:
  RELEASE_COMMIT: ${{ github.event.inputs.commit || 'openvscode-server-v1.109.5' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real x64 Intel image -- macos-latest is arm64 now, and the
          # binary this job produces needs to run on the actual (Intel)
          # dev machine. Supported through Aug 2027 per GitHub's own
          # runner-images tracker (actions/runner-images#13045).
          - os: macos-15-intel
            platform: darwin
            arch: x64
          # Pinned below windows-latest's June 2026 move to VS2026 (v18),
          # which node-gyp can't detect yet (nodejs/node-gyp#3282).
          # windows-2022 keeps VS2022 (v17), which node-gyp does recognize.
          - os: windows-2022
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out openvscode-server
        uses: actions/checkout@v4
        with:
          repository: gitpod-io/openvscode-server
          ref: ${{ env.RELEASE_COMMIT }}
          path: openvscode-server

      - name: Set up Node (from the checkout's own .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: openvscode-server/.nvmrc

      - name: Set up Python (node-gyp needs it to build native modules like node-pty)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: npm ci
        working-directory: openvscode-server
        run: npm ci
        env:
          # Matches the real release workflow's own env for this step --
          # keeps V8 code-cache writes out of the way during a fresh build.
          DISABLE_V8_COMPILE_CACHE: 1
          # macOS only: see the file-level comment (fix #2) -- disables
          # fmt's consteval compile-time format-string checking inside
          # @vscode/spdlog's bundled fmt, which this lockfile's pinned
          # 0.15.7 doesn't yet do on its own.
          CXXFLAGS: ${{ matrix.platform == 'darwin' && '-DFMT_CONSTEVAL=' || '' }}

      - name: Build core (unmangled -- see fix #4 below)
        working-directory: openvscode-server
        # core-ci runs compile-build-with-mangling, which OOM'd on the
        # Windows job ("Committing semi space failed... heap out of
        # memory") after ~3 hours in the mangler's rename-edit pass over
        # 9494 classes / 11860 exported symbols -- a real, unresolved
        # upstream problem (microsoft/vscode#243708 hit the identical
        # failure on a 32-core/32GB local machine, closed "not planned").
        # gulpfile.vscode.ts also defines core-ci-pr -- upstream's own
        # cheaper PR-validation variant, identical except it runs
        # compile-build-without-mangling. Mangling only obfuscates/shrinks
        # names for official releases; it buys nothing for a local dev
        # sidecar binary, so use core-ci-pr instead of fighting the OOM.
        run: npm run gulp core-ci-pr

      - name: Build extensions
        working-directory: openvscode-server
        run: npm run gulp extensions-ci

      - name: Minify the reh-web server
        working-directory: openvscode-server
        run: npm run gulp minify-vscode-reh-web

      - name: Build vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}
        working-directory: openvscode-server
        run: npm run gulp vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}-min-ci

      - name: Locate the build output
        shell: bash
        run: |
          # Same convention the real release workflow relies on: gulp
          # writes the built server to a directory named
          # vscode-reh-web-<platform>-<arch>, as a sibling of the checkout
          # (i.e. next to the "openvscode-server" folder), not inside it.
          ls -la .
          test -d "vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}" && \
            echo "found: vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}" || \
            (echo "::error::build output directory not found where expected -- see the 'ls -la .' output above" && exit 1)

      - name: Smoke test - launch the real built server and verify it responds
        shell: bash
        run: |
          set -e
          # A green gulp build and an actually-working editor sidecar are
          # different claims (see the file-level comment on 4.1's CI
          # findings) -- neither this sandbox nor the Mac's own local
          # helper VM can execute a real macOS/Windows GUI-server binary,
          # so this runs the real README-documented launch command
          # (./bin/openvscode-server, --host/--port/--connection-token/
          # --user-data-dir/--extensions-dir/--default-folder/
          # --accept-server-license-terms -- confirmed against product.json's
          # serverApplicationName and src/vs/server/node/
          # serverEnvironmentService.ts's real argv definitions, the exact
          # flags EditorConfig/EditorSupervisor already build) on the CI
          # runner itself, right where the binary was just built, and
          # curls the token-bearing URL EditorSupervisor::url() builds --
          # not just that gulp exited 0.
          DIR="vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}"
          TOKEN="ci-smoke-test-token"
          mkdir -p /tmp/ovsc-smoke/user-data /tmp/ovsc-smoke/extensions /tmp/ovsc-smoke/workspace

          if [ "${{ matrix.platform }}" = "win32" ]; then
            LAUNCHER="./$DIR/bin/openvscode-server.cmd"
          else
            LAUNCHER="./$DIR/bin/openvscode-server"
            chmod +x "$LAUNCHER"
          fi

          "$LAUNCHER" \
            --host 127.0.0.1 --port 39999 \
            --connection-token "$TOKEN" \
            --user-data-dir /tmp/ovsc-smoke/user-data \
            --extensions-dir /tmp/ovsc-smoke/extensions \
            --default-folder /tmp/ovsc-smoke/workspace \
            --accept-server-license-terms &
          SERVER_PID=$!

          UP=""
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:39999/?tkn=$TOKEN" -o /tmp/ovsc-smoke-response.html; then
              UP=1
              break
            fi
            sleep 2
          done

          if [ -z "$UP" ] || ! grep -qi "workbench\|<!DOCTYPE html>" /tmp/ovsc-smoke-response.html 2>/dev/null; then
            echo "::error::openvscode-server did not respond with an HTML page within 60s -- the build succeeded but the binary itself doesn't serve"
            cat /tmp/ovsc-smoke-response.html 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          echo "openvscode-server is real and serving -- first 300 bytes of the token-authed page:"
          head -c 300 /tmp/ovsc-smoke-response.html
          echo
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Package the build output
        shell: bash
        run: |
          NAME="openvscode-server-orchestrator-build-${{ matrix.platform }}-${{ matrix.arch }}"
          mv "vscode-reh-web-${{ matrix.platform }}-${{ matrix.arch }}" "$NAME"
          tar -czf "$NAME.tar.gz" "$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvscode-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: openvscode-server-orchestrator-build-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          retention-days: 14
