[package]
name = "orchestrator-core"
version.workspace = true
edition.workspace = true
description = "Domain model, event bus, and SQLite state for Odoo Orchestrator. UI-framework-agnostic on purpose — no tauri dependency here."

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
notify = "8.2.0"
# For content hashes that decide whether a cached template is stale and
# whether a module needs updating. A persisted cache key has to mean the
# same thing across Rust releases, which rules out `DefaultHasher` — its
# own docs say the algorithm can change.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# File-identity comparison (`same_file_identity` test helper in lib.rs) on
# stable Rust: the std equivalent on Windows, `MetadataExt::file_index()`,
# sits behind the unstable `windows_by_handle` feature (rust-lang/rust#63010)
# and won't compile on stable at all — this crate already rides along
# transitively (notify -> same-file on Windows), promoted here to a direct
# dependency now that test code calls it directly.
same-file = "1"
