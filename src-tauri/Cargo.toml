[workspace]
resolver = "2"
members = [
    "crates/orchestrator-core",
    "crates/orchestrator-api",
    ".",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "orchestrator-shell"
version.workspace = true
edition.workspace = true
description = "Thin Tauri desktop shell that boots orchestrator-core and orchestrator-api."

[[bin]]
name = "orchestrator-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orchestrator-core = { path = "crates/orchestrator-core" }
orchestrator-api = { path = "crates/orchestrator-api" }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = "0.3"
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
